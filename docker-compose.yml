services:
  phpfpm:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: loom_phpfpm
    volumes:
      - ./loom-magento:/var/www/html
    depends_on:
      - db
      - opensearch
      - redis
    networks:
      - loom_network

  cron:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: loom_cron
    volumes:
      - ./loom-magento:/var/www/html
    depends_on:
      - db
      - opensearch
      - redis
      - phpfpm
    networks:
      - loom_network
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "while true; do
        su www-data -s /bin/sh -c 'php /var/www/html/bin/magento cron:run' >> /var/www/html/var/log/cron.log 2>&1;
        sleep 60;
      done"

  nginx:
    image: nginx:1.25-alpine
    container_name: loom_nginx
    ports:
      - "8080:80"
    volumes:
      - ./loom-magento:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/magento.conf:/etc/nginx/magento.conf
    depends_on:
      - phpfpm
    networks:
      - loom_network

  db:
    image: mysql:8.0
    container_name: loom_db
    environment:
      MYSQL_ROOT_PASSWORD: magento_root_pass
      MYSQL_DATABASE: magento
      MYSQL_USER: magento
      MYSQL_PASSWORD: magento_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - loom_network
    command: --default-authentication-plugin=mysql_native_password

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: loom_opensearch
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - loom_network

  redis:
    image: redis:7.2-alpine
    container_name: loom_redis
    ports:
      - "6379:6379"
    networks:
      - loom_network

networks:
  loom_network:
    driver: bridge

volumes:
  db_data:
  opensearch_data:
